name: DeepMD integration smoke test

on:
  pull_request:
  push:
    branches:
      - master

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  deepmd-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install nox
        run: uv pip install nox[uv]
      - name: Run DeepMD integration smoke tests
        run: nox -s tests-deepmd
